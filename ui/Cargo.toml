[package]
name = "mic-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
build = "build.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "advanced"] }
png = "0.18"
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"
uuid = { version = "1", features = ["v4"] }
velopack = "=1.2.110-ge826545"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = "debuginfo"
