name: Publish runtime component

on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [core, rvc]
        required: true
      version:
        description: Runtime version
        required: true

permissions:
  contents: write

jobs:
  runtime:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with: { clean: false }
      - name: Package signed component
        shell: pwsh
        env:
          COMPONENT_SIGNING_KEY: ${{ secrets.COMPONENT_SIGNING_KEY }}
        run: .\scripts\package-components.ps1 -Kind '${{ inputs.kind }}' -Version '${{ inputs.version }}'
      - name: Publish immutable component release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'runtime-${{ inputs.kind }}-v${{ inputs.version }}'
          $assets = Get-ChildItem ".tmp\component-${{ inputs.kind }}\out" -File | ForEach-Object FullName
          gh release create $tag @assets --title $tag --notes 'Signed MicNoiseReducer runtime component.'
