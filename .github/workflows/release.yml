name: Release Mic Noize

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version such as 0.1.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $value = "${{ inputs.version }}"
          if (-not $value) { $value = "${{ github.ref_name }}".TrimStart('v') }
          if ($value -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid semver' }
          "value=$value" >> $env:GITHUB_OUTPUT
      - name: Restore runtime build inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .tmp\runtime | Out-Null
          gh release download runtime-core-v1 --pattern core-runtime-1.part000 --dir .tmp\runtime
          tar.exe -xf .tmp\runtime\core-runtime-1.part000 -C .
          .\build.ps1 -NativeOnly
      - name: Build and verify
        shell: pwsh
        env:
          MNR_TELEMETRY_SECRET: ${{ secrets.MNR_TELEMETRY_SECRET }}
        run: |
          .\verify.ps1
          .\scripts\package-release.ps1 -Version '${{ steps.version.outputs.value }}' -Stage
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.value }}'
          $assets = Get-ChildItem Releases -File | ForEach-Object FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "Mic Noize $tag" --notes-file release\notes.md
          }
