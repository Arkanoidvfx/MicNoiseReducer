name: Release Mic Noize

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version such as 0.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $value = "${{ inputs.version }}"
          if (-not $value) { $value = "${{ github.ref_name }}".TrimStart('v') }
          if ($value -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid semver' }
          "value=$value" >> $env:GITHUB_OUTPUT
      # The build compiles only against the NVIDIA and TAG headers (their DLLs load at run time):
      # a 22 KB asset instead of the 1.15 GB core runtime. Rebuild it from the same vendor
      # folders when runtime-core changes.
      - name: Restore runtime headers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .tmp\runtime | Out-Null
          gh release download runtime-core-v2 --pattern runtime-headers-2.tar.zst --dir .tmp\runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime headers download failed.' }
          tar.exe -xf .tmp\runtime\runtime-headers-2.tar.zst -C .
          if ($LASTEXITCODE -ne 0) { throw 'Runtime headers extraction failed.' }
      - name: Build native
        shell: pwsh
        run: .\build.ps1 -NativeOnly
      # Registry/git sources and compiled dependencies. Reuse the last cache from this rustc
      # across patch-version Cargo.lock changes; Cargo still checks fingerprints. Dispatch
      # releases so the public default branch can restore its prior cache.
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            .cache/cargo/registry/index
            .cache/cargo/registry/cache
            .cache/cargo/git/db
            build/rust
          key: rust-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('ui/Cargo.lock') }}
          restore-keys: |
            rust-${{ steps.toolchain.outputs.cachekey }}-
      # Never trust a cached Mic Noize binary: the release exe is always compiled from this commit.
      - name: Drop cached Mic Noize artifacts
        shell: pwsh
        run: Remove-Item build\rust\release\.fingerprint\micnoize-* -Recurse -Force -ErrorAction SilentlyContinue
      - name: Build and verify
        shell: pwsh
        env:
          MNR_TELEMETRY_SECRET: ${{ secrets.MNR_TELEMETRY_SECRET }}
        run: |
          .\verify.ps1
          .\scripts\package-release.ps1 -Version '${{ steps.version.outputs.value }}' -Stage
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.value }}'
          $assets = Get-ChildItem Releases -File | ForEach-Object FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "Mic Noize $tag" --notes-file release\notes.md
          }
